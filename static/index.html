<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8208662455546800"
     crossorigin="anonymous"></script>
  <meta name="google-site-verification" content="0yVz3m3iYVAS-9VF3lUnngHlsOsDzOI_I1etI34o_Jg" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wechat | Real-Time Chat</title>
  <style>
    :root {
      --bg-dark: #071029;
      --bg: #071a2b;
      --surface: #0b2940;
      --text-primary: #eef2ff;
      --text-muted: #9fb3c8;
      --accent: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 90px; 
    }

    * { box-sizing: border-box; }

    /* Header */
    .chat-header {
      position: sticky;
      top: 0;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      backdrop-filter: blur(10px);
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      border-radius: 10px; color: #eef2ff;
      display: grid; place-items: center; font-weight: bold; font-size: 1.2rem;
    }
    .brand-text h1 { margin: 0; font-size: 1.2rem; }
    .brand-text p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }
    
    .chat-tips { 
      display: flex; 
      flex-direction: column; 
      align-items: flex-end; 
      gap: 4px; 
      font-size: 0.8rem; 
    }
    
    .privacy-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* Messages Area */
    .chat-window {
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row { display: flex; width: 100%; }
    .message-row.mine { justify-content: flex-end; }

    .bubble {
      max-width: 80%;
      padding: 12px;
      background: var(--surface);
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }
    .bubble.mine {
      background: rgba(6, 182, 212, 0.15);
      border-color: rgba(6, 182, 212, 0.4);
    }

    .bubble-title {
      font-size: 0.8rem; color: var(--text-muted);
      margin-bottom: 5px; display: flex; justify-content: space-between; gap: 15px;
    }
    .bubble-text { font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }

    /* FIXED BOTTOM INPUT */
    .chat-input-panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 15px;
      background: var(--bg);
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 100; 
      box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
    }

    .recipient-select {
      background: var(--surface);
      color: var(--accent);
      border: 1px solid rgba(148, 163, 184, 0.4);
      border-radius: 20px;
      padding: 0 10px;
      height: 44px;
      outline: none;
      max-width: 110px;
    }

    .chat-input {
      flex: 1;
      height: 44px;
      border-radius: 22px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      background: var(--surface);
      color: var(--text-primary);
      padding: 0 15px;
      font-size: 1rem;
      outline: none;
    }

    .voice-button, .send-button {
      height: 44px;
      border: none;
      border-radius: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .voice-button {
      width: 44px;
      background: var(--surface);
      color: white;
      font-size: 1.2rem;
      border: 1px solid rgba(148, 163, 184, 0.4);
    }
    .voice-button.recording { background: var(--danger); }

    .send-button {
      padding: 0 18px;
      background: var(--accent);
      color: #000;
    }

    /* Overlays & Floating Privacy Modal */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.8);
      display: none; place-items: center; z-index: 200;
    }
    
    .panel {
      background: var(--bg); padding: 25px; border-radius: 15px;
      width: 90%; max-width: 400px; border: 1px solid var(--accent);
      text-align: center;
    }
    .panel input {
      width: 100%; padding: 12px; margin: 15px 0; border-radius: 8px;
      border: 1px solid gray; background: var(--surface); color: white;
    }
    .panel button {
      width: 100%; padding: 12px; border-radius: 8px; background: var(--accent);
      border: none; font-weight: bold; cursor: pointer;
    }

    /* Call modal */
    #callModal { position: fixed; inset: 0; display: none; place-items: center; z-index: 400; background: rgba(0,0,0,0.75); }
    .call-panel { background: var(--bg); padding: 12px; border-radius: 10px; width: 90%; max-width: 900px; display: grid; gap:12px; grid-template-columns: 1fr 1fr; align-items: start; }
    .video-box { background: #000; border-radius: 8px; height: 360px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .video-box video { width: 100%; height: 100%; object-fit: cover; }
    .call-controls { display:flex; gap:8px; align-items:center; }
    .end-call { background: var(--danger); color: white; border: none; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .delete-button { border: 0; background: rgba(239,68,68,.2); color: #fecaca; border-radius: 4px; padding: 2px 6px; cursor: pointer; font-size: 0.7rem; }
  </style>
</head>
<body>
  <script async="async" data-cfasync="false" src="https://pl30648882.effectivecpmnetwork.com/183cff4d1413c471392b57698a3951b3/invoke.js"></script>
<div id="container-183cff4d1413c471392b57698a3951b3"></div>
  <!-- Privacy Policy removed per update; ads and Google tags preserved -->

  <!-- Header -->
  <header class="chat-header">
    <div class="brand">
      <div class="brand-icon">W</div>
      <div class="brand-text">
        <h1>Wechat</h1>
        <p>Real-time messaging</p>
      </div>
    </div>
    <div class="chat-tips">
      <div id="statusText" style="color: var(--success); font-weight:bold;">Connecting...</div>
      <div id="onlineCount" style="color:var(--text-muted);font-size:0.9rem;">0 online</div>
      <div id="typingIndicator" style="color:var(--text-muted);font-size:0.85rem;height:18px"></div>
    </div>
  </header>

  <!-- Google Ad -->
  <div style="text-align: center; margin: 10px 0;">
    <ins class="adsbygoogle"
         style="display:inline-block;width:100%;height:50px"
         data-ad-client="ca-pub-8208662455546800"
         data-ad-slot="4595257649"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <!-- Messages Container -->
  <main id="chatWindow" class="chat-window"></main>

  <!-- FIXED Input Panel -->
  <form id="inputForm" class="chat-input-panel" action="javascript:void(0)">
    <select id="recipientSelect" class="recipient-select">
      <option value="">Public</option>
    </select>
    <input id="messageInput" class="chat-input" type="text" placeholder="Type here..." required autocomplete="off" />
    <button id="videoCallButton" type="button" class="voice-button" title="Start Video Call">📹</button>
    <button id="audioCallButton" type="button" class="voice-button" title="Start Voice Call">📞</button>
    <button id="voiceButton" type="button" class="voice-button">🎙</button>
    <button type="submit" class="send-button">Send</button>
  </form>

  <!-- Auth Overlay -->
  <div id="authOverlay" class="overlay">
    <div class="panel">
      <h2>Welcome to Wechat</h2>
      <input id="displayName" type="text" placeholder="Enter display name" maxlength="20" />
      <button id="loginButton">Join Chat</button>
    </div>
  </div>

  <!-- Ban Overlay -->
  <div id="banOverlay" class="overlay">
    <div class="panel" style="border-color: var(--danger);">
      <h2 style="color: var(--danger);">Access Restricted</h2>
      <p>Banned for 24 hours (Abusive Language).</p>
      <p id="banCountdown" style="font-weight:bold;"></p>
    </div>
  </div>

  <!-- Call Modal (Video / Voice) -->
  <div id="callModal">
    <div class="call-panel">
      <div>
        <div style="display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px;">
          <strong id="callTitle">Call</strong>
          <div class="call-controls"><span id="callStatus" style="color:var(--text-muted)">Idle</span></div>
        </div>
        <div class="video-box"><video id="remoteVideo" autoplay playsinline></video></div>
      </div>
      <div>
        <div style="margin-bottom:8px;"><small style="color:var(--text-muted)">Your preview</small></div>
        <div class="video-box"><video id="localVideo" autoplay muted playsinline></video></div>
        <div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end;">
          <button id="endCallBtn" class="end-call">End Call</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Privacy modal removed — ads preserved. Call and signaling handlers follow below.

    const wsScheme = window.location.protocol === 'https:' ? 'wss' : 'ws';
    const wsUrl = `${wsScheme}://${window.location.host}/ws`;
    const authOverlay = document.getElementById('authOverlay');
    const statusText = document.getElementById('statusText');
    const chatWindow = document.getElementById('chatWindow');
    const inputForm = document.getElementById('inputForm');
    const messageInput = document.getElementById('messageInput');
    const displayNameInput = document.getElementById('displayName');
    const loginButton = document.getElementById('loginButton');
    const voiceButton = document.getElementById('voiceButton');
    const recipientSelect = document.getElementById('recipientSelect');
    
    let websocket;
    let currentUser = '';
    let mediaRecorder, voiceChunks = [];
    let allMessages = [];
    let knownUsers = new Set();
    
    // WebRTC / call state
    let localStream = null;
    let pc = null;
    let isInCall = false;
    const pcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    
    const ABUSIVE_WORDS = ['fuck','fucking','shit','bitch','asshole','chutiya','chootiya','chut','madarchod','maderchod','mc','bhenchod','benchod','bc','gandu','gaand','harami','lund','lauda','loda','randi','saale','saala','kamine','bhosdike'];
    const BAN_KEY = 'wechatBanUntil';
    const WARNING_KEY = 'wechatAbuseWarning';
    let banTimer;

    const savedName = localStorage.getItem('wechatDisplayName');
    if (savedName) {
      currentUser = savedName;
      authOverlay.style.display = 'none';
      connectSocket();
    } else {
      authOverlay.style.display = 'grid';
    }

    function formatTime(iso) { return new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }

    function addKnownUser(username) {
      if (username && username !== currentUser && !knownUsers.has(username)) {
        knownUsers.add(username);
        const opt = document.createElement('option');
        opt.value = username; opt.textContent = username;
        recipientSelect.appendChild(opt);
      }
    }

    function parseRecipient(content) {
      try { const parsed = JSON.parse(content); if (parsed && parsed.to) return parsed.to; } catch(e) {} return null;
    }

    function shouldShowMessage(msg) {
      const activeTab = recipientSelect.value;
      const recipient = parseRecipient(msg.content);
      if (!activeTab) return !recipient;
      return (recipient === activeTab && msg.username === currentUser) || (msg.username === activeTab && recipient === currentUser);
    }

    function reRenderChat() {
      chatWindow.innerHTML = '';
      allMessages.forEach(msg => { if (shouldShowMessage(msg)) appendMessageDOM(msg, msg.username === currentUser); });
      window.scrollTo(0, document.body.scrollHeight);
    }

    recipientSelect.addEventListener('change', reRenderChat);

    // Typing indicator handling
    const typingIndicatorEl = document.getElementById('typingIndicator');
    const typingState = {};
    let localTyping = false;
    let typingTimeout = null;

    function sendTypingState(state) {
      if (websocket?.readyState === WebSocket.OPEN && currentUser) websocket.send(JSON.stringify({ type: 'typing', username: currentUser, state }));
    }

    function handleTypingIndicator(username, state) {
      if (!username || username === currentUser) return;
      if (state === 'start') {
        typingState[username] = Date.now();
      } else {
        delete typingState[username];
      }
      renderTyping();
      // clear after 3s
      setTimeout(() => { delete typingState[username]; renderTyping(); }, 3000);
    }

    function renderTyping() {
      const users = Object.keys(typingState);
      if (users.length === 0) typingIndicatorEl.textContent = '';
      else if (users.length === 1) typingIndicatorEl.textContent = `${users[0]} is typing...`;
      else typingIndicatorEl.textContent = `${users.slice(0,2).join(', ')} are typing...`;
    }

    messageInput.addEventListener('input', () => {
      if (!localTyping) { localTyping = true; sendTypingState('start'); }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { localTyping = false; sendTypingState('stop'); }, 2000);
    });

    function appendMessageDOM({ username, content, timestamp, id }, isMine) {
      const row = document.createElement('div');
      row.className = `message-row ${isMine ? 'mine' : ''}`;
      row.dataset.messageId = id;
      
      const bubble = document.createElement('div');
      bubble.className = `bubble ${isMine ? 'mine' : ''}`;
      
      const title = document.createElement('div'); title.className = 'bubble-title';
      const recipient = parseRecipient(content);
      title.innerHTML = `<span>${recipient ? '<strong>'+username+'</strong> (Private)' : username}</span> <span>${formatTime(timestamp)}</span>`;
      bubble.appendChild(title);

      const body = document.createElement('div'); body.className = 'bubble-text';
      let voiceData = null, displayText = content;
      try { 
        const parsed = JSON.parse(content); 
        if (parsed) {
            if (parsed.kind === 'voice') voiceData = parsed; 
            else if (parsed.kind === 'private') displayText = parsed.text;
        }
      } catch (e) {}

      if (voiceData) {
        if (Number(voiceData.expiresAt || 0) <= Date.now()) { body.textContent = 'Audio expired.'; }
        else {
          const audio = document.createElement('audio'); audio.controls = true; audio.style.height='35px'; audio.style.maxWidth='200px'; audio.src = voiceData.data;
          body.appendChild(audio);
        }
      } else { body.textContent = displayText; }
      
      bubble.appendChild(body);

      if (isMine) {
         const del = document.createElement('button'); del.className='delete-button'; del.textContent='Del';
         del.onclick = () => {
             if(confirm('Delete message?') && websocket.readyState === WebSocket.OPEN) {
                 websocket.send(JSON.stringify({ type: 'delete', id: parseInt(id), username: currentUser }));
             }
         };
         title.appendChild(del);
      }
      row.appendChild(bubble); chatWindow.appendChild(row);
      window.scrollTo(0, document.body.scrollHeight);
    }

    function containsAbuse(text) { 
      const n = text.toLowerCase().replace(/[013@]/g, m => ({'0':'o','1':'i','3':'e','@':'a'}[m])).replace(/[^a-z]/g, '');
      return ABUSIVE_WORDS.some(w => n.includes(w)); 
    }

    function getBanUntil(){ return Number(localStorage.getItem(BAN_KEY)||0); }
    function isBanned(){ return Date.now() < getBanUntil(); }

    function updateBanUI(){ 
      const banned = isBanned(); 
      messageInput.disabled = banned; voiceButton.disabled = banned; 
      inputForm.querySelector('button').disabled = banned;
      if(banned){ 
        document.getElementById('banOverlay').style.display = 'grid'; 
        const tick = () => {
          const left = Math.max(0, getBanUntil() - Date.now()); 
          document.getElementById('banCountdown').textContent = `Ban: ${Math.ceil(left/3600000)}h left`; 
          if(!left){ clearInterval(banTimer); document.getElementById('banOverlay').style.display='none'; updateBanUI(); }
        }; 
        tick(); clearInterval(banTimer); banTimer = setInterval(tick, 30000);
      } 
    }

    async function connectSocket() {
      websocket = new WebSocket(wsUrl);
      websocket.onopen = () => {
        statusText.textContent = 'Connected';
        statusText.style.color = 'var(--success)';
        // announce presence
        if (currentUser && websocket?.readyState === WebSocket.OPEN) websocket.send(JSON.stringify({ type: 'join', username: currentUser }));
      };

      websocket.onmessage = (event) => {
        try {
         const p = JSON.parse(event.data);
         // Chat history and messages
         if (p.type === 'history') {
           allMessages = p.messages;
           allMessages.forEach(m => addKnownUser(m.username));
           reRenderChat();
         } else if (p.type === 'message') {
           allMessages.push(p); addKnownUser(p.username);
           if (shouldShowMessage(p)) appendMessageDOM(p, p.username === currentUser);
         } else if (p.type === 'presence') {
            // presence update: { type: 'presence', users: [...] }
            try { 
              const users = Array.isArray(p.users) ? p.users : [];
              // update recipient list with known users
              users.forEach(u => addKnownUser(u));
              const onlineCount = users.length;
              document.getElementById('onlineCount').textContent = `${onlineCount} online`;
            } catch (e) {}
         } else if (p.type === 'typing') {
            // show typing indicator briefly
            try {
              const who = p.username;
              const state = p.state || 'start';
              handleTypingIndicator(who, state);
            } catch (e) {}
         } else if (p.type === 'delete') {
           document.querySelector(`.message-row[data-message-id="${p.id}"]`)?.remove();
           allMessages = allMessages.filter(m => m.id !== p.id);

         // WebRTC signaling handlers
         } else if (p.type === 'webrtc_offer') {
           // incoming offer
           if (!p.to || p.to === currentUser) handleIncomingOffer(p);
         } else if (p.type === 'webrtc_answer') {
           if (p.to === currentUser) handleIncomingAnswer(p);
         } else if (p.type === 'webrtc_ice') {
           if (p.to === currentUser && pc) {
            try { pc.addIceCandidate(new RTCIceCandidate(p.candidate)); } catch (e) {}
           }
         } else if (p.type === 'call_end') {
           if (!p.to || p.to === currentUser) endCall(true);
         }
        } catch (e) {}
      };
      
      websocket.onclose = () => {
        statusText.textContent = 'Disconnected...'; statusText.style.color = 'var(--danger)';
        setTimeout(connectSocket, 3000);
      };
    }

    inputForm.onsubmit = (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content) return;
      if (isBanned()) { updateBanUI(); return; }
      
      if (containsAbuse(content)) {
        if (localStorage.getItem(WARNING_KEY) === '1') {
          localStorage.setItem(BAN_KEY, String(Date.now() + 86400000));
          localStorage.removeItem(WARNING_KEY); alert('Banned for 24 hours.'); updateBanUI();
        } else { localStorage.setItem(WARNING_KEY, '1'); alert('WARNING: Abusive language!'); }
        return;
      }
      
      const payload = recipientSelect.value ? JSON.stringify({ kind: 'private', to: recipientSelect.value, text: content }) : content;
      if (websocket?.readyState === WebSocket.OPEN) {
        websocket.send(JSON.stringify({ type: 'message', username: currentUser, content: payload }));
        messageInput.value = '';
      }
    };

    voiceButton.onpointerdown = async () => {
      if (isBanned()) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream); voiceChunks = [];
        mediaRecorder.ondataavailable = e => voiceChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (websocket?.readyState === WebSocket.OPEN) {
              websocket.send(JSON.stringify({ type: 'message', username: currentUser, content: JSON.stringify({ kind: 'voice', data: reader.result, expiresAt: Date.now() + 5400000 }) }));
            }
          };
          reader.readAsDataURL(new Blob(voiceChunks, { type: 'audio/webm' }));
        };
        mediaRecorder.start(); voiceButton.classList.add('recording');
      } catch (err) { alert('Mic access required.'); }
    };

    voiceButton.onpointerup = () => {
      if (mediaRecorder?.state === 'recording') { mediaRecorder.stop(); voiceButton.classList.remove('recording'); }
    };

    // Call UI elements
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const callModal = document.getElementById('callModal');
    const callTitle = document.getElementById('callTitle');
    const callStatus = document.getElementById('callStatus');
    const endCallBtn = document.getElementById('endCallBtn');
    const videoCallButton = document.getElementById('videoCallButton');
    const audioCallButton = document.getElementById('audioCallButton');

    function showCallUI(kind, peer) {
      callTitle.textContent = `${kind === 'video' ? 'Video' : 'Voice'} Call`;
      callStatus.textContent = `In call with ${peer || 'Group'}`;
      callModal.style.display = 'grid';
    }

    function hideCallUI() {
      callModal.style.display = 'none';
      callStatus.textContent = 'Idle';
      localVideo.srcObject = null; remoteVideo.srcObject = null;
    }

    async function createPeerConnection(target) {
      pc = new RTCPeerConnection(pcConfig);
      pc.onicecandidate = (e) => { if (e.candidate && websocket?.readyState === WebSocket.OPEN) websocket.send(JSON.stringify({ type: 'webrtc_ice', from: currentUser, to: target || null, candidate: e.candidate })); };
      pc.ontrack = (e) => {
        try {
          const stream = (e.streams && e.streams[0]) ? e.streams[0] : new MediaStream([e.track]);
          remoteVideo.srcObject = stream;
          // attempt to play (some browsers block autoplay until user interacts)
          remoteVideo.play().catch(()=>{});
        } catch (err) { console.error('ontrack attach error', err); }
      };
      if (localStream) {
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      }
      return pc;
    }

    async function startCall(kind) {
      if (!currentUser) { alert('Join chat first'); return; }
      if (isInCall) { alert('Already in a call'); return; }
      const recipient = recipientSelect.value || null; // null means group
      try {
        localStream = await navigator.mediaDevices.getUserMedia(kind === 'video' ? { audio: true, video: true } : { audio: true });
        localVideo.srcObject = localStream;
        const pcLocal = await createPeerConnection(recipient);
        isInCall = true; showCallUI(kind, recipient || 'Group');

        const offer = await pcLocal.createOffer();
        await pcLocal.setLocalDescription(offer);
        if (websocket?.readyState === WebSocket.OPEN) {
          websocket.send(JSON.stringify({ type: 'webrtc_offer', from: currentUser, to: recipient, sdp: offer.sdp, kind }));
        }
      } catch (err) { console.error(err); alert('Unable to start call (permissions or device issue).'); }
    }

    async function handleIncomingOffer(p) {
      const from = p.from;
      const kind = p.kind || 'audio';
      // Ask user to accept
      const accept = confirm(`${from} is calling (${kind}). Accept?`);
      if (!accept) { if (websocket?.readyState === WebSocket.OPEN) websocket.send(JSON.stringify({ type: 'call_end', from: currentUser, to: from })); return; }
      try {
        localStream = await navigator.mediaDevices.getUserMedia(kind === 'video' ? { audio: true, video: true } : { audio: true });
        localVideo.srcObject = localStream;
        const pcLocal = await createPeerConnection(from);
        await pcLocal.setRemoteDescription({ type: 'offer', sdp: p.sdp });
        const answer = await pcLocal.createAnswer();
        await pcLocal.setLocalDescription(answer);
        if (websocket?.readyState === WebSocket.OPEN) websocket.send(JSON.stringify({ type: 'webrtc_answer', from: currentUser, to: from, sdp: answer.sdp }));
        isInCall = true; showCallUI(kind, from);
      } catch (err) { console.error(err); }
    }

    async function handleIncomingAnswer(p) {
      if (!pc) return;
      try { await pc.setRemoteDescription({ type: 'answer', sdp: p.sdp }); } catch (e) { console.error(e); }
    }

    function endCall(remote=false) {
      try { if (pc) { pc.close(); pc = null; } } catch (e) {}
      try { if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; } } catch (e) {}
      isInCall = false; hideCallUI();
      if (!remote && websocket?.readyState === WebSocket.OPEN) websocket.send(JSON.stringify({ type: 'call_end', from: currentUser, to: recipientSelect.value || null }));
    }

    videoCallButton.onclick = () => startCall('video');
    audioCallButton.onclick = () => startCall('audio');
    endCallBtn.onclick = () => endCall(false);

    loginButton.onclick = () => {
      if (!displayNameInput.value.trim()) return;
      currentUser = displayNameInput.value.trim();
      localStorage.setItem('wechatDisplayName', currentUser);
      authOverlay.style.display = 'none'; connectSocket();
    };
    updateBanUI();
  </script>
</body>
</html>
